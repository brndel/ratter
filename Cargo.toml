[workspace]
resolver = "3"
members = [
    "app",
    "backend",
    "condition-engine",
    "numbers",
    "persist",
    "ratter-cluster",
    "shared-core",
    "wobble-graph", "xtask",
]

default-members = ["app"]

[workspace.dependencies]
app.path = "app"
backend.path = "backend"
shared-core.path = "shared-core"
wobble-graph.path = "wobble-graph"
persist.path = "persist"
condition-engine.path = "condition-engine"
numbers.path = "numbers"
ratter-cluster.path = "ratter-cluster"

# matter-controller = { version = "0.18.3", features = ["ble"] }
# matter-clusters = "0.6.0"
# matter-interaction = "0.4.3"
# matter-commissioning = "0.10.2"
# matter-codec = "0.3.2"

matter-controller = { git = "https://github.com/brndel/matter-rust", rev = "dbfed5f757480aae01ac8c8f8b48e32e76b8e41b", features = [
    "ble",
] }
matter-clusters = { git = "https://github.com/brndel/matter-rust", rev = "dbfed5f757480aae01ac8c8f8b48e32e76b8e41b", features = [
    "serde",
] }
matter-interaction = { git = "https://github.com/brndel/matter-rust", rev = "dbfed5f757480aae01ac8c8f8b48e32e76b8e41b" }
matter-commissioning = { git = "https://github.com/brndel/matter-rust", rev = "dbfed5f757480aae01ac8c8f8b48e32e76b8e41b" }
matter-codec = { git = "https://github.com/brndel/matter-rust", rev = "dbfed5f757480aae01ac8c8f8b48e32e76b8e41b" }


# matter-controller = { path = "../matter-rust/crates/matter-controller", features = ["ble"] }
# matter-clusters = { path = "../matter-rust/crates/matter-clusters" }
# matter-interaction = { path = "../matter-rust/crates/matter-interaction" }
# matter-commissioning = { path = "../matter-rust/crates/matter-commissioning" }
# matter-codec = { path = "../matter-rust/crates/matter-codec" }

quick-xml = "0.42"
change-case = "0.2"
strum = {version = "0.28", features = ["derive"]}

dioxus = { version = "0.7.9", features = ["router", "fullstack"] }
dioxus-html = { version = "0.7.9", features = ["serialize"] }
dioxus-stores = { version = "0.7.9" }
dioxus-free-icons = { version = "0.10", features = ["font-awesome-solid"] }
web-sys = { version = "0.3.103", features = ["ToggleEvent"] }

serde = { version = "1.0", features = ["derive"] }
serde_with = "3.23"
serde_json = "1.0"
uuid = { version = "1.26", features = ["serde"] }
anyhow = "1.0"
thiserror = "2.0"
futures = "0.3"
derive_more = "2.1"
nest_struct = "0.5"
bitflags = "2.13"

notify = "8.2.0"
tokio = { version = "1.53", features = ["sync"] }
tokio-util = "0.7.19"
tokio-stream = "0.1.19"
gloo-timers = "0.4"
hex = "0.4.3"
base64 = "0.23"

toml = "1.1.5+spec-1.1.0"
jiff = { version = "0.2.35", features = ["serde"] }
rand = "0.10.2"
either_of = "0.1.9"
itertools = "0.15"

getrandom_0_2_17 = { package = "getrandom", version = "0.2.17" }
getrandom_0_3_4 = { package = "getrandom", version = "0.3.4" }
getrandom_0_4_3 = { package = "getrandom", version = "0.4.3" }

reqwest = { version = "0.13", features = ["json"] }
sha2 = "0.11"
sha3 = "0.12"

# backend
toasty = { version = "0.10.0", default-features = false, features = [
    "migration",
    "sqlite",
    "serde",
    "jiff",
] }
toasty-cli.version = "0.10.0"
