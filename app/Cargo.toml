[package]
name = "ratter-app"
version = "0.1.0"
authors = ["Armin <ar.braendle@gmail.com>"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dioxus.workspace = true
dioxus-html.workspace = true
dioxus-free-icons.workspace = true
web-sys = { workspace = true, optional = true}

serde.workspace = true
anyhow.workspace = true
futures.workspace = true
derive_more.workspace = true

shared-core.workspace = true
backend = { workspace = true, optional = true }

chrono.workspace = true
rand.workspace = true

getrandom_0_3_4.workspace = true
getrandom_0_4_3.workspace = true

[features]
web = [
    "dioxus/web",
    "getrandom_0_3_4/wasm_js",
    "getrandom_0_4_3/wasm_js",
    "dep:web-sys"
]
default = ["web", "server"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
server = ["dioxus/server", "dep:backend"]
